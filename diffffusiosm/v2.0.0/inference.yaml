# LDSR-S2 V2 research preview inference settings from simon-donike/RS-SR-LTDF.
# The V2 preview is experimental; V1 remains the recommended canonical model.
apply_normalization: false
ckpt_version: opensr-ldsrs2_v2_0_0_preview.ckpt
encode_conditioning: true
spectral_correction: back_projection
back_projection:
  scale: 4
  blur_sigma: 0.0
  max_iterations: 100
  tolerance: 1.0e-06
  relaxation: 1.0
denoiser_settings:
  linear_start: 0.0015
  linear_end: 0.0155
  timesteps: 1000
  parameterization: eps
  sampler: dpm_solver++
  sampling_eta: 0.0
  sampling_temperature: 1.0
  sampling_steps: 3
first_stage_config:
  embed_dim: 4
  double_z: true
  z_channels: 4
  resolution: 512
  in_channels: 4
  out_ch: 4
  ch: 128
  ch_mult: [1, 2, 4]
  num_res_blocks: 2
  attn_resolutions: []
  dropout: 0.0
cond_stage_config:
  image_size: 128
  in_channels: 8
  model_channels: 160
  out_channels: 4
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  channel_mult: [1, 2, 2, 4]
  num_head_channels: 32
other:
  concat_mode: true
  cond_stage_trainable: false
  first_stage_key: image
  cond_stage_key: LR_image
